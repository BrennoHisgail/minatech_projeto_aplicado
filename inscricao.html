<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscrição — MinaTech</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap"
        rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-container" data-page="inscricao"></div>

  <!-- Cabeçalho da página -->
  <div class="form-page-header">
    <div class="container">
      <p class="fs-5 fw-normal">
        Preencha o formulário abaixo para garantir
        <em>sua vaga.</em>
      </p>
    </div>
  </div>

  <!-- =====================================================
       COMPONENTE: Multi-step Form
       ===================================================== -->
  <div class="form-layout">
    <div class="container">
      <div class="row g-4">

        <!-- Sidebar com etapas -->
        <div class="col-lg-3">
          <div class="steps-sidebar">

            <div class="step-item active" data-step="0">
              <div class="step-circle">1</div>
              <span class="step-label">Dados pessoais</span>
            </div>

            <div class="step-item" data-step="1">
              <div class="step-circle">2</div>
              <span class="step-label">Contato</span>
            </div>

            <div class="step-item" data-step="2">
              <div class="step-circle">3</div>
              <span class="step-label">Diversidade e inclusão</span>
            </div>

            <div class="step-item" data-step="3">
              <div class="step-circle">4</div>
              <span class="step-label">Situação familiar</span>
            </div>

            <div class="step-item" data-step="4">
              <div class="step-circle">5</div>
              <span class="step-label">Acesso digital</span>
            </div>

          </div>
        </div>

        <!-- Painel do formulário -->
        <div class="col-lg-9">
          <div class="form-panel">
            <form id="multi-step-form" novalidate>

              <!-- ── ETAPA 1: Dados pessoais ── -->
              <div class="form-step active">
                <h4 class="form-section-label">Dados pessoais</h4>

                <div class="mb-3">
                  <label class="form-label fw-semibold" for="nome">Nome completo</label>
                  <input type="text" id="nome" name="nome"
                         class="form-control" placeholder="Digite seu nome completo" />
                </div>

                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="idade">Idade</label>
                    <input type="number" id="idade" name="idade"
                           class="form-control" placeholder="Quantos anos você tem?" min="10" max="99" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="escolaridade">Escolaridade</label>
                    <select id="escolaridade" name="escolaridade" class="form-select">
                      <option value="" disabled selected>Selecione</option>
                      <option>Ensino Fundamental — anos iniciais</option>
                      <option>Ensino Fundamental — anos finais</option>
                      <option>Ensino Médio</option>
                      <option>Ensino Superior</option>
                    </select>
                  </div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                  <button type="button" class="btn btn-pink btn-next">
                    Próximo <i class="bi bi-arrow-right ms-1"></i>
                  </button>
                </div>
              </div>

              <!-- ── ETAPA 2: Contato ── -->
              <div class="form-step">
                <h4 class="form-section-label">Contato</h4>

                <div class="mb-3">
                  <label class="form-label fw-semibold" for="telefone">Telefone</label>
                  <input type="tel" id="telefone" name="telefone"
                         class="form-control" placeholder="+55 (48) 9-0000-0000" />
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold" for="email">E-mail</label>
                  <input type="email" id="email" name="email"
                         class="form-control" placeholder="seuemail@gmail.com" />
                </div>

                <div class="d-flex justify-content-between mt-4">
                  <button type="button" class="btn btn-outline-pink btn-prev">
                    <i class="bi bi-arrow-left me-1"></i> Anterior
                  </button>
                  <button type="button" class="btn btn-pink btn-next">
                    Próximo <i class="bi bi-arrow-right ms-1"></i>
                  </button>
                </div>
              </div>

              <!-- ── ETAPA 3: Diversidade e inclusão ── -->
              <div class="form-step">
                <h4 class="form-section-label">Diversidade e inclusão</h4>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="genero">Gênero</label>
                    <select id="genero" name="genero" class="form-select">
                      <option value="" disabled selected>Selecione</option>
                      <option>Mulher cisgênero</option>
                      <option>Mulher transgênero</option>
                      <option>Não-binário</option>
                      <option>Outro</option>
                      <option>Prefiro não dizer</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="raca">Raça</label>
                    <select id="raca" name="raca" class="form-select">
                      <option value="" disabled selected>Selecione</option>
                      <option>Branca</option>
                      <option>Preta</option>
                      <option>Parda</option>
                      <option>Amarela</option>
                      <option>Indígena</option>
                    </select>
                  </div>
                </div>

                <!-- Opções não-sei / prefiro não dizer -->
                <div class="d-flex gap-3 mb-3">
                  <button type="button" class="btn btn-outline-secondary btn-sm">
                    Não sei ao certo
                  </button>
                  <button type="button" class="btn btn-pink btn-sm">
                    Prefiro não dizer
                  </button>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold" for="alergia">
                    Possui alguma alergia?
                  </label>
                  <input type="text" id="alergia" name="alergia"
                         class="form-control"
                         placeholder="Ex.: glúten, amendoim, remédios…" />
                </div>

                <div class="d-flex justify-content-between mt-4">
                  <button type="button" class="btn btn-outline-pink btn-prev">
                    <i class="bi bi-arrow-left me-1"></i> Anterior
                  </button>
                  <button type="button" class="btn btn-pink btn-next">
                    Próximo <i class="bi bi-arrow-right ms-1"></i>
                  </button>
                </div>
              </div>

              <!-- ── ETAPA 4: Situação familiar ── -->
              <div class="form-step">
                <h4 class="form-section-label">Situação familiar</h4>

                <div class="mb-3">
                  <label class="form-label fw-semibold" for="faixa-social">
                    Faixa social da família
                  </label>
                  <select id="faixa-social" name="faixaSocial" class="form-select">
                    <option value="" disabled selected>Selecione a faixa</option>
                    <option>Classe A (acima de 20 SM)</option>
                    <option>Classe B (10 a 20 SM)</option>
                    <option>Classe C (4 a 10 SM)</option>
                    <option>Classe D (2 a 4 SM)</option>
                    <option>Classe E (até 2 SM)</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold" for="num-pessoas">
                    Quantas pessoas moram em sua casa?
                  </label>
                  <select id="num-pessoas" name="numPessoas" class="form-select">
                    <option value="" disabled selected>Selecione</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5 ou mais</option>
                  </select>
                </div>

                <div class="d-flex justify-content-between mt-4">
                  <button type="button" class="btn btn-outline-pink btn-prev">
                    <i class="bi bi-arrow-left me-1"></i> Anterior
                  </button>
                  <button type="button" class="btn btn-pink btn-next">
                    Próximo <i class="bi bi-arrow-right ms-1"></i>
                  </button>
                </div>
              </div>

              <!-- ── ETAPA 5: Acesso digital ── -->
              <div class="form-step">
                <h4 class="form-section-label">Acesso digital</h4>

                <p class="fw-semibold mb-3">
                  Quais dispositivos tem em sua casa?
                </p>

                <!-- Computador / notebook -->
                <div class="row align-items-center mb-3 g-2">
                  <div class="col-sm-7">
                    <label class="form-label mb-0">Computador / notebook</label>
                  </div>
                  <div class="col-sm-5">
                    <select class="form-select form-select-sm" name="computador">
                      <option value="sim">Sim</option>
                      <option value="nao">Não</option>
                    </select>
                  </div>
                </div>

                <!-- Celular / tablet -->
                <div class="row align-items-center mb-3 g-2">
                  <div class="col-sm-7">
                    <label class="form-label mb-0">Celular / tablet</label>
                  </div>
                  <div class="col-sm-5">
                    <select class="form-select form-select-sm" name="celular">
                      <option>1</option>
                      <option>2</option>
                      <option>3 ou mais</option>
                      <option>Nenhum</option>
                    </select>
                  </div>
                </div>

                <!-- Nenhum -->
                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox"
                         id="nenhum" name="nenhum" />
                  <label class="form-check-label" for="nenhum">
                    Nenhum dos acima
                  </label>
                </div>

                <div class="d-flex justify-content-between mt-4">
                  <button type="button" class="btn btn-outline-pink btn-prev">
                    <i class="bi bi-arrow-left me-1"></i> Anterior
                  </button>
                  <button type="submit" class="btn btn-pink">
                    Inscreva-se já <i class="bi bi-check-lg ms-1"></i>
                  </button>
                </div>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>

  <!-- Feedback ao submeter -->
  <script>
    document.getElementById('multi-step-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Inscrição realizada com sucesso! Em breve entraremos em contato.');
    });
  </script>

</body>
</html>
