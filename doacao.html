<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doação — MinaTech</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap"
        rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-container" data-page="doacao"></div>

  <!-- =====================================================
       COMPONENTE: Donation Form
       ===================================================== -->
  <section class="donation-section">
    <div class="container">

      <h1>
        Preencha as informações para se tornar um
        <em>patrocinador.</em>
      </h1>
      <div class="divider-pink"></div>

      <div class="donation-form-wrap mt-4">
        <form id="donation-form" novalidate>

          <!-- Dados pessoais -->
          <p class="field-section-label">Dados pessoais</p>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="doador-nome">
              Nome completo
            </label>
            <input type="text" id="doador-nome" name="nome"
                   class="form-control" placeholder="Digite seu nome completo" />
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold" for="doador-email">
              Email de contato
            </label>
            <input type="email" id="doador-email" name="email"
                   class="form-control" placeholder="SeuEmail@gmail.com" />
          </div>

          <!-- PIX -->
          <p class="field-section-label">PIX</p>

          <div class="pix-block">

            <!-- QR Code placeholder — substituir pela imagem real -->
            <div class="qr-placeholder">
              <span>QR Code PIX</span>
            </div>

            <!-- Botão copiar link -->
            <button type="button" class="btn-copy-link" id="btn-copy-pix">
              <i class="bi bi-link-45deg me-1"></i>Copiar link
            </button>

          </div>

          <!-- Botão concluir -->
          <button type="submit" class="btn btn-pink w-100 mt-3 py-3">
            Concluir doação
          </button>

        </form>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>

  <!-- Feedback ao submeter -->
  <script>
    document.getElementById('donation-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Obrigada pela sua doação! Logo entraremos em contato.');
    });
  </script>

</body>
</html>
